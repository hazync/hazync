[package]
name = "swiftsync-verify"
version = "0.1.0"
edition = "2021"
description = "Standalone verifier for a libzync proof that a SwiftSync hints file is correct"
license = "MIT"
publish = false

# NOT a member of the prover workspace, and NOT depending on `methods`: a verifier needs the guest's IMAGE
# ID, not the guest, so the ids are embedded as hex literals (src/lib.rs IMAGES) and the prover, Core and CUDA
# stay out of this build. Same design as ../verifier (hazync-verify).
#
# The checks live in the library so a CLI, a C ABI and a WASM build can share ONE implementation of them.

[lib]
name = "swiftsync_verify"
path = "src/lib.rs"

[[bin]]
name = "swiftsync-verify"
path = "src/main.rs"

[[bin]]
name = "zync-path"
path = "src/zync_path.rs"

[[bin]]
name = "zync-serve"
path = "src/zync_serve.rs"

[features]
# zync-serve's tip mode (docs/libzync/ZAPP_FOLLOWER.md §10 Z2-Z4): facts read from a prep run's disk trie at pinned roots,
# no history. Build it with the zync-serve profile (panic = "unwind": a walk the store moved under is caught and answered
# 503, never an abort): cargo build --profile zync-serve --features tip --bin zync-serve. The core verifier and its
# .wasm never enable it.
tip = ["libzync/reader"]
# engine (OpenVM) proofs: `verify_engine` (engine/VERIFIER.md). Off until the wasm build carries OpenVM's wasm patch;
# the default once the RISC Zero front is removed.
engine = ["dep:hazync-engine-verify"]

[dependencies]
# disable-dev-mode: RISC0_DEV_MODE can never make this verifier accept a fake receipt (review round 3).
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
# The hint hash (§3 of the proposal) from the crate the prover uses; without default features it is sha2 only.
libzync = { path = "../libzync", default-features = false, features = ["tls"] }   # per-thread node format (COINLOG.md §2)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
hazync-engine-verify = { path = "../engine/verify-core", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# zync-serve with the tip feature (see [features]): release, but a panic unwinds (Reader::walk catches it)
[profile.zync-serve]
inherits = "release"
panic = "unwind"

[workspace]
