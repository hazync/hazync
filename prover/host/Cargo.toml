[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
serde_json = "1"
methods = { path = "../methods" }
# `prove` is NOT a default feature (default = ["client", "bonsai"]), and without it risc0's
# default_prover() falls back to ExternalProver — which shells out to `r0vm`, a ~109 MB binary this
# release does not ship. That is why the CPU host could not prove for a fresh contributor while the
# CUDA host could: `cuda = ["prove", ...]` pulls it in, so the GPU path had a linked-in prover and the
# "No GPU still works" path had a missing dependency and an OS errno.
risc0-zkvm = { version = "=3.0.5", features = ["prove"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
bitcoin = "0.32"
bincode = "1"
num-bigint = "0.4"
hintsfile = "0.2.0"
# libzync: the hint formats, producers and network parameters shared with the guest (one copy).
libzync = { path = "../../libzync" }
# libzync laptop tools: build the guest memory image once per process (lz_execute). Already in the lock.
risc0-binfmt = "=3.0.5"
hazync-utreexo = { path = "../../accumulator" }
hazync-coinbase-smt = { path = "../../coinbase-smt", features = ["std", "serde"] }

[features]
cuda = ["risc0-zkvm/cuda"]
