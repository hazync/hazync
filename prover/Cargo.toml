[workspace]
resolver = "2"
members = ["host", "methods", "zyncapps/host"]

# Always optimize: the host's prep, coin log and trie stores are slow unoptimised.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

# Laptop builds of the host (no LTO). The guest is built by the engine (hzengine build) from its own manifest, so this
# cannot change the guest.
[profile.fasthost]
inherits = "release"
lto = false
debug = 0
codegen-units = 16
