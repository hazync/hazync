[package]
name = "zyncapp-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zyncapp"
path = "src/main.rs"

[features]
cuda = ["risc0-zkvm/cuda"]

[dependencies]
zyncapp-methods = { path = "../methods" }
risc0-zkvm = { version = "=3.1.0", features = ["prove"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bincode = "1"
swiftsync-verify = { path = "../../../swiftsync-verify" }
libzync = { path = "../../../libzync", default-features = false, features = ["utreexo"] }
# the utreexo tip step runs natively before proving (#[path] methods/utreexo-tip/src/step.rs): Floresta's accumulator code
rustreexo = "=0.7.0"
