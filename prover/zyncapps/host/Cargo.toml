[package]
name = "zyncapp-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zyncapp"
path = "src/main.rs"

[features]
cuda = ["risc0-zkvm/cuda"]

[dependencies]
zyncapp-methods = { path = "../methods" }
risc0-zkvm = { version = "=3.1.0", features = ["prove"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bincode = "1"
swiftsync-verify = { path = "../../../swiftsync-verify" }
# The hints zAPP module (zapps/hints, docs/libzync/ZYNCAPPS.md §9): its verifier, the one the CLI, C ABI and WASM run.
zapp-hints = { path = "../../../zapps/hints" }
libzync = { path = "../../../libzync", default-features = false, features = ["hints"] }
