name: windows-prove
# A release build says so in its run name: scripts/windows-host.sh takes the release's host.exe only from such a run.
run-name: ${{ inputs.release_build == 'true' && 'windows-prove RELEASE BUILD (no caches, --locked)' || 'windows-prove' }}

# The Windows DRIVER host (CUTOVER C8 step 5, 28.11.2026): prover/host built natively for Windows (CPU, MSVC), the
# program that prepares blocks, writes the guest's input streams, keeps the coin log, the trie and the BIP30 tree, and
# drives the engine (hzengine.exe, built by engine-windows.yml) for every guest run. Since C8 it embeds no guest and
# carries no prover: the RISC Zero guest job (reproduce/libzync.Dockerfile), the embedded ELF, the CUDA host
# (build-cuda) and the RISC Zero prove of block 1 went with RISC Zero's backend. v0.27.1 is the last release whose
# Windows host proved on RISC Zero (its record: run 36933650193, block 170 in 2875.1 s; the CUDA build, #631).
#
# What this run shows on Windows, with no engine and no GPU (both are hzengine's):
#   * host.exe imports only DLLs every Windows has (no Visual C++ runtime, no CUDA, no nvcuda.dll);
#   * it refuses to name an image id it was not given (method-id, no engine set up: exit 1), and names the board key's
#     (the engine chain's proof of mainnet 1..200 in swiftsync-verify/tests/data/engine200: its vk.bin and pin);
#   * libzync-prep of mainnet 1..200 from genesis (prover/testdata/libzync/mainnet) on Windows reaches EXACTLY the
#     state the engine proved on Linux: verify-any of that proof with --check-end against these prep states, under the
#     pinned key (verify-core: the STARK, the public values, the image, then the range and end checks), says RANGE-OK
#     ... end=board; and a proof byte or a journal byte changed is refused.
# What it cannot show: an engine prove on Windows (hzengine.exe on a real card: ROADMAP 2.9, engine/WINDOWS_TEST.md).
#
# ⛔ DISPATCH A BRANCH, NOT main, while this is being changed: a workflow_dispatch run attaches its check to the commit
# it ran against, and a red on main's HEAD reads as main being broken (run 36892040422 once did that).

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: 'DISPATCH A BRANCH, NOT main — see the warning in this file'
        default: 'dispatch this on a branch; a failure on main posts a red check against main'
      release_build:
        description: "'true' = the host.exe a release ships: no cargo caches restored, --locked (review 11-12, release #5)"
        default: 'false'

permissions:
  contents: read
  actions: read

jobs:
  # The job keeps its name `prove` (scripts/windows-host.sh takes the CPU host from the run's `prove` job) and its
  # artifact name hazync-host-windows-x86_64-cpu.
  prove:
    # ⛔ PINNED since its host.exe ships: windows-latest moves under a release (review of a04038ce, L11).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build the driver host for Windows (CPU, MSVC, static CRT; no guest)
        shell: bash
        working-directory: prover
        env:
          # the libzync product profile (methods/build.rs: the profile constants the guest is built with)
          HAZYNC_LIBZYNC: '1'
          # ⛔ +crt-static (review of a04038ce, M1): without it host.exe imports VCRUNTIME140.dll, VCRUNTIME140_1.dll and
          # MSVCP140.dll, which an ordinary office PC may not have. 32 MB main-thread stack: Windows reserves 1 MB per
          # thread (Linux gives 8 MB) and the main thread's is fixed in the PE header at link time.
          RUSTFLAGS: -C link-arg=/STACK:33554432 -C target-feature=+crt-static
        run: |
          set -o pipefail
          # the toolchain is prover/rust-toolchain.toml's (the dtolnay step only installs rustup's default)
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc -V | awk '{print $2}')
          echo "rustc $got (prover/rust-toolchain.toml: $want)"
          [ "$got" = "$want" ] || { echo "::error::rustc $got is not prover/rust-toolchain.toml's $want"; exit 1; }
          # ⛔ KEEP THE WHOLE LOG (a tail once ate the one diagnostic needed, run 36896243277)
          set +e
          cargo build -p host --release --locked > build.log 2>&1
          rc=$?
          set -e
          echo "cargo exit: $rc  ($(wc -l < build.log) lines captured)"
          if [ "$rc" -ne 0 ]; then
              echo "=== last 120 lines ==="; tail -120 build.log
              exit "$rc"
          fi
          tail -5 build.log
          ls -l target/release/host.exe

      - name: ⛔ host.exe imports only DLLs every Windows has (no VC++ runtime, no CUDA)
        shell: bash
        run: python3 scripts/pe_imports.py prover/target/release/host.exe --cpu

      - name: ⭐ The driver on Windows - prep 1..200 reaches the engine-proved state; verify-any; refusals
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -o pipefail
          H=prover/target/release/host.exe; D=swiftsync-verify/tests/data/engine200
          PIN=$(cut -c1-64 "$D/vk.sha256")
          fail() { echo "::error::$*"; exit 1; }
          # the genesis tip every board range from block 1 starts at (the pinned mainnet genesis anchor)
          G=$("$H" libzync-genesis-tip | tr -d '\r')
          echo "libzync-genesis-tip $G"
          [ "$G" = 852c5c7e009317c2dd232dcf9b1a9e2babd58df324add461a6ff61824f390167 ] || fail "genesis tip $G"
          # no engine set up: no image id to name (exit 1, the reason said)
          set +e; "$H" method-id > mid0.log 2>&1; rc=$?; set -e
          cat mid0.log
          [ "$rc" = 1 ] && grep -aq 'runs the guest on the OpenVM engine' mid0.log || fail "method-id with no engine: exit $rc"
          # the board key's image
          M=$(HAZYNC_ENGINE_VK="$D/vk.bin" HAZYNC_ENGINE_VK_PIN=$PIN "$H" method-id | tr -d '\r' | grep -oE '[0-9a-f]{64}' | head -1)
          echo "method-id (board key) $M"
          [ -n "$M" ] || fail "method-id with the board key printed no id"
          # prep 1..200 from genesis on Windows, stamped with the key's image
          HAZYNC_ENGINE_VK="$D/vk.bin" HAZYNC_ENGINE_VK_PIN=$PIN "$H" libzync-prep 1 200 prover/testdata/libzync/mainnet genesis prep200 > prep.log 2>&1 \
            || { tail -20 prep.log; fail "libzync-prep 1..200"; }
          tail -1 prep.log
          V() { HAZYNC_ENGINE_VK="$D/vk.bin" HAZYNC_ENGINE_VK_PIN=$PIN HAZYNC_LZ_STATE_DIR=prep200 HAZYNC_BRIDGE_OUT=no-bundles "$H" verify-any "$@"; }
          L=$(V "$D/proof.hze" 1 --check-end | tr -d '\r') || fail "verify-any of the engine proof of 1..200 refused it"
          echo "$L"
          echo "$L" | grep -q "^RANGE-OK lo=1 hi=200 in_tip=$G .* image=$M .* anchored=1 end=board$" || fail "not RANGE-OK ... end=board: $L"
          python3 -c "b=bytearray(open('$D/proof.hze','rb').read());b[-5]^=1;open('bad_journal.hze','wb').write(b)"
          python3 -c "b=bytearray(open('$D/proof.hze','rb').read());b[4000]^=1;open('bad_proof.hze','wb').write(b)"
          for f in bad_journal.hze bad_proof.hze; do
            set +e; V "$f" 1 > "$f.log" 2>&1; rc=$?; set -e
            echo "$f: exit $rc: $(cat "$f.log")"
            [ "$rc" = 1 ] && grep -aq 'forged, tampered or corrupt' "$f.log" || fail "$f was not refused as a forgery"
          done
          echo "WINDOWS_DRIVER_OK: prep 1..200 on Windows == the engine-proved state at 200 (end=board); forgeries refused"

      # ⛔ THE ARTIFACT IS THE DELIVERABLE (name kept: scripts/windows-host.sh fetches it)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hazync-host-windows-x86_64-cpu
          path: prover/target/release/host.exe
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-build-log
          path: |
            prover/build.log
            prep.log
          retention-days: 14
