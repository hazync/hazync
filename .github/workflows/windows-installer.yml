name: windows-installer
# Hazync-Setup.exe: the Windows app as a normal installer (tools/win-gui/installer/hazync.iss). Builds the app with
# PyInstaller, takes the prover (host.exe + cudart) and the worker from a published release, checked against that
# release's SHA256SUMS.txt, packs them with Inno Setup, then INSTALLS it silently on the runner, runs the installed
# app as the worker's interpreter, and uninstalls it, checking the signing key folder survives. The installer is an
# artifact. A release gets it from release-sign.yml, which calls this workflow with `release: true` (the tag's own
# app, the release's own prover), attaches it, and signs it with the rest (docs/BUILD_AND_RELEASE.md).
#
# Not Authenticode-signed (owner's decision, 11-13): SmartScreen warns until it is.

on:
  pull_request:
    paths:
      - 'tools/win-gui/**'
      - 'coordinator/hazync'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "release whose prover and worker go inside (blank = the latest release)"
        default: ''
      version:
        description: "installer version (blank = <release>-dev.<run number>)"
        default: ''
  workflow_call:
    inputs:
      tag:
        description: "the release being signed"
        type: string
        required: true
      release:
        description: "build the TAG's app, versioned as the tag (release-sign.yml)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      # A release builds THE TAG's app (the same pinning reason as release-sign.yml's checkout: a re-sign from a later
      # main must not pack a newer app into an old release). Otherwise the branch under test.
      - name: Which source (a release builds its tag, validated first)
        id: src
        shell: bash
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$IN_RELEASE" = true ]; then
            [[ "$IN_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: '$IN_TAG'"; exit 1; }
            echo "ref=refs/tags/$IN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Build tools, pinned
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1 cryptography==44.0.0

      - name: The frozen-interpreter dispatch (unit test)
        working-directory: tools/win-gui
        run: |
          python test_frozenpy.py
          python test_frozenpy.py --control

      - name: The app's own behaviour, in real Tk windows on Windows (name prompt, GPU preparing, keeps going)
        working-directory: tools/win-gui
        run: |
          python test_name_on_start.py
          python test_name_on_start.py --control
          python test_gpuprep.py
          python test_gpuprep.py --control
          python test_keep_going.py
          python test_keep_going.py --control
          python test_range_progress.py
          python test_range_progress.py --control
          python test_winquiet.py
          python test_winquiet.py --control
          python test_also_fold.py
          python test_also_fold.py --control
          python test_map_link.py
          python test_map_link.py --control
          python test_log_visible.py
          python test_log_visible.py --control
          python test_home_flow.py

      - name: The prover and the worker, from the release, checked against its SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TAG: ${{ inputs.tag }}
          IN_VERSION: ${{ inputs.version }}
          IN_RELEASE: ${{ inputs.release }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="$IN_TAG"
          [ -n "$tag" ] || tag=$(gh release view -R hazync/hazync --json tagName --jq .tagName)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: '$tag'"; exit 1; }
          mkdir -p rel && cd rel
          gh release download "$tag" -R hazync/hazync -p 'hazync-host-x86_64-windows-cuda.zip' -p 'hazync-worker'
          if gh release download "$tag" -R hazync/hazync -p 'SHA256SUMS.txt' 2>/dev/null; then
            for f in hazync-host-x86_64-windows-cuda.zip hazync-worker; do
              want=$(awk -v f="$f" '$2==f || $2=="*"f {print $1}' SHA256SUMS.txt)
              got=$(sha256sum "$f" | cut -d' ' -f1)
              [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::$f does not match $tag's SHA256SUMS.txt"; exit 1; }
              echo "$f: sha256 matches $tag's signed manifest"
            done
          elif [ "$IN_RELEASE" = true ]; then
            # The FIRST signing of a release: no manifest yet. The sign job hashes these same assets and this installer
            # into one manifest, and the install step below checks the packed host.exe is the zip's, byte for byte.
            echo "first signing of $tag: no manifest yet; the sign job covers the zip, the worker and this installer together"
          else
            echo "::error::$tag has no SHA256SUMS.txt"; exit 1
          fi
          python -c "import zipfile; zipfile.ZipFile('hazync-host-x86_64-windows-cuda.zip').extractall('prover')"
          ls -la prover
          v="$IN_VERSION"; [ -n "$v" ] || v="${tag#v}-dev.$RUN_NUMBER"
          [ "$IN_RELEASE" != true ] || v="${tag#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"; echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build the app (PyInstaller, one folder)
        working-directory: tools/win-gui
        run: |
          pyinstaller --clean --noconfirm hazync-gui.spec
          ls dist/Hazync | head

      - name: The frozen app is the worker's interpreter (before packing)
        working-directory: tools/win-gui
        run: |
          out=$(./dist/Hazync/Hazync.exe -c "import cryptography, concurrent.futures, secrets, socket, urllib.request; print('frozen-ok', cryptography.__version__)")
          echo "$out"; [[ "$out" == frozen-ok* ]] || { echo "::error::Hazync.exe -c did not run as an interpreter"; exit 1; }

      - name: Pack Hazync-Setup.exe (Inno Setup)
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          # -D/-O, not /D//O: Git bash rewrites an argument starting with "/" into a Windows path
          [ -x "$ISCC" ] || { choco install innosetup -y --no-progress --version=6.4.3 >/dev/null && ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"; }
          "$ISCC" -Q "-DAppVersion=$VERSION" "-DAppDir=$(cygpath -w "$PWD/tools/win-gui/dist/Hazync")" \
                  "-DProverDir=$(cygpath -w "$PWD/rel/prover")" "-DWorker=$(cygpath -w "$PWD/rel/hazync-worker")" \
                  "-O$(cygpath -w "$PWD/out")" tools/win-gui/installer/hazync.iss
          ls -la out
          (cd out && sha256sum hazync-setup-x86_64-windows.exe | tee hazync-setup-x86_64-windows.exe.sha256)

      - name: Install it, use it, uninstall it (as a person would, silently)
        run: |
          KEYDIR="$USERPROFILE/.hazync"; mkdir -p "$KEYDIR"; echo keep > "$KEYDIR/sentinel-do-not-delete"
          ./out/hazync-setup-x86_64-windows.exe //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //NORESTART "//LOG=$(cygpath -w "$PWD/out/install.log")"
          APP="$LOCALAPPDATA/Programs/Hazync"
          for f in Hazync.exe hazync-worker prover/host.exe; do [ -f "$APP/$f" ] || { echo "::error::$f not installed"; exit 1; }; done
          ls "$APP/prover"
          # the installed prover is the release's: it carries the published mainnet image (a GPU-less runner cannot RUN it)
          ID=$(awk '$1=="libzync-product" && $2=="mainnet" {print $4}' reproduce/LIBZYNC_IDS)
          python -c "import sys;n=open(sys.argv[1],'rb').read().count(bytes.fromhex(sys.argv[2]));print('image',sys.argv[2][:8],n,'x');sys.exit(0 if n>=1 else 1)" "$APP/prover/host.exe" "$ID"
          # ...and is the release zip's host.exe, byte for byte: the sign job cannot look inside a compressed installer,
          # so this is what ties the signed installer to the signed zip.
          a=$(sha256sum "$APP/prover/host.exe" | cut -c1-64); b=$(sha256sum rel/prover/host.exe | cut -c1-64)
          [ "$a" = "$b" ] || { echo "::error::the installed host.exe ($a) is not the release zip's ($b)"; exit 1; }
          echo "installed host.exe = the release zip's ($a)"
          # the installed app runs the installed worker: make a key in a scratch HAZYNC_HOME and read it back
          export HAZYNC_HOME="$RUNNER_TEMP/hz-home" PYTHONPATH="$(cygpath -w "$APP/_internal/winshim")"
          out=$("$APP/Hazync.exe" "$(cygpath -w "$APP/hazync-worker")" id 2>&1); echo "$out"
          echo "$out" | grep -Eq '^pubkey *: *[0-9a-f]{64}' || { echo "::error::the installed worker did not make a key"; exit 1; }
          "$APP/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          for i in $(seq 1 30); do [ -e "$APP/Hazync.exe" ] || break; sleep 2; done
          [ ! -e "$APP/Hazync.exe" ] || { echo "::error::uninstall left Hazync.exe"; exit 1; }
          [ -f "$KEYDIR/sentinel-do-not-delete" ] || { echo "::error::uninstall touched ~/.hazync"; exit 1; }
          echo "installed, used, uninstalled; ~/.hazync untouched"

      - uses: actions/upload-artifact@v4
        with:
          name: hazync-setup-x86_64-windows
          path: |
            out/hazync-setup-x86_64-windows.exe
            out/hazync-setup-x86_64-windows.exe.sha256
          retention-days: 30
