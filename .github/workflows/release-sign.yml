name: Sign release

# PGP-sign a release's binaries so downloads are verifiable against the maintainer key
# (fingerprint in SECURITY.md), mirroring the bitcoin-ghost/ghost release signing.
#
# Hazync binaries are built on a GPU box and uploaded to the release (not built in CI), so this
# workflow does NOT build them — it downloads the release assets, writes a SHA256SUMS.txt manifest over
# the binaries, PGP-signs it, and uploads SHA256SUMS.txt + SHA256SUMS.txt.asc back onto the release.
# The one thing it builds is the aarch64 verifier (below). Since v0.23.0 that is the libzync verifier
# (`swiftsync-verify`, shipped as hazync-verify-*), and the release's asset set must be exactly
# scripts/release-assets.txt at the signed tag.
#
# Runs automatically when a release is published, and can be run manually against an existing tag
# (Actions → Sign release → Run workflow → enter the tag) to sign or re-sign a past release.
#
# REQUIRES two repo secrets (same values as bitcoin-ghost/ghost): GPG_PRIVATE_KEY (armoured private
# key) and GPG_PASSPHRASE. Until they are set the sign step fails with an actionable message.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v0.5.2)"
        required: true

permissions:
  contents: write

jobs:
  build-aarch64-verifier:
    # BUILT HERE, NOT COMMITTED (hazync#85). This binary used to live in verifier/dist/ and be
    # cross-compiled by hand. Every re-baseline stranded it: refreshing it needs a cross-toolchain no
    # dev box has, so the tree carried a verifier for a retired guest that rejected every current
    # proof. It happened once already at the be5e0528 re-baseline, and again at dfc9eeda.
    #
    # Its staleness is also invisible to the obvious check: swapping one 64-hex literal for another is
    # LENGTH-PRESERVING, so a stale binary is byte-identical in size to a correct one. The assertion
    # below greps the embedded id out of the raw bytes, which is the only thing that actually catches it.
    #
    # ⛔ ONLY FOR VERSION TAGS. `sign` refuses anything but vMAJOR.MINOR.PATCH, but this job ran first
    # and had no such check: a data-only release (evidence-136432, the UTXO evidence of #662) would get
    # a verifier binary attached it never asked for, and then a red run when `sign` refused the tag.
    # Skipping here skips `sign` too (it `needs:` this job). A manual run is still allowed, and `sign`
    # still validates the tag it is given.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      # The tag is shape-checked HERE, before the checkout below uses it (review 11-12, release #7): this job builds and
      # runs tree code under `contents: write`, and the dispatch input reached its checkout unvalidated. Through the
      # environment, never spliced into shell text (see the sign job's step).
      - name: Resolve and validate tag
        id: tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::refusing: '$RAW_TAG' is not a vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
      # PIN TO THE TAG BEING SIGNED, not the default branch (hazync#90).
      #
      # A bare checkout takes the default branch. On the normal `release: published` trigger those are
      # the same commit, so nothing shows. But this workflow is also runnable by hand against ANY tag —
      # the runbook tells you to do exactly that to sign or re-sign a past release — and there the two
      # diverge. Re-signing v0.15.0 from a v0.16.0 main would build a verifier embedding the NEW guest,
      # --clobber it onto the OLD release, and then attest it in that release's SHA256SUMS.
      #
      # That is worse than shipping something unsigned. An unsigned artifact is detectable; this would
      # be a WRONG artifact carrying a good signature and a matching checksum, on a release whose every
      # proof it rejects. The id assertion below reads the checked-out tree, so pinning the ref is also
      # what makes that assertion mean "matches THIS tag" rather than "matches main".
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Install the aarch64 cross toolchain (and qemu, to RUN what it builds)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
      - name: Build the aarch64 verifier
        # The libzync verifier CLI (`swiftsync-verify`, its own crate; the CORE `verifier/` is in
        # history/ since #676). Only the CLI binary: zync-path and zync-serve are not release assets.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked --manifest-path swiftsync-verify/Cargo.toml \
                --target aarch64-unknown-linux-gnu --bin swiftsync-verify
          cp swiftsync-verify/target/aarch64-unknown-linux-gnu/release/swiftsync-verify hazync-verify-aarch64
      - name: Assert it embeds the CANONICAL guest id
        # The whole reason this job exists. A verifier pinned to the wrong guest rejects every real
        # proof, and nothing downstream would notice — sha256 and PGP both pass over a stale binary.
        #
        # "Canonical" means canonical FOR THE TAG BEING SIGNED. That is only true because the checkout
        # above is pinned to that tag: reproduce/METHOD_ID is read from the checked-out tree, so an
        # unpinned checkout would silently compare against main's id and pass while building a verifier
        # that is wrong for this release (hazync#90).
        #
        # Since v0.23.0 "canonical" is the published libzync mainnet image (reproduce/LIBZYNC_IDS), which
        # reproduce/METHOD_ID must name too; the FULL 64-hex id is matched, as scripts/check-dist.sh does.
        run: |
          CANON=$(awk '$1=="libzync-product" && $2=="mainnet" {print $4}' reproduce/LIBZYNC_IDS)
          MID=$(grep -vE '^[[:space:]]*#' reproduce/METHOD_ID | grep -oE '[0-9a-f]{64}' | head -1)
          if [ -z "$CANON" ] || [ "$CANON" != "$MID" ]; then
            echo "::error::reproduce/LIBZYNC_IDS (mainnet '$CANON') and reproduce/METHOD_ID ('$MID') disagree"
            exit 1
          fi
          n=$(strings hazync-verify-aarch64 | grep -c "$CANON" || true)
          echo "embedded occurrences of ${CANON:0:8}: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::aarch64 verifier does not embed the canonical id ${CANON:0:8} — it would reject every current proof"
            exit 1
          fi
      - name: It must accept a real libzync proof and refuse tampered ones
        # An embedded id is not a working verifier. Run the binary (under qemu) on the real mainnet
        # 1..200 receipt in the tree, and on a flipped seal byte, a flipped journal byte, a wrong tip and
        # RISC0_DEV_MODE: the same CLI cases scripts/release.sh runs on the x86_64 verifier before publish.
        env:
          CLI_WRAP: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: ./scripts/check-release-verifiers.sh --cli ./hazync-verify-aarch64
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        # Not over one the release already carries: on a re-sign this build's bytes can differ from the signed one
        # (another runner image), and the sign job refuses a re-sign that changes a signed asset. The one already there
        # was tested by this job when it was attached.
        run: |
          if gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx hazync-verify-aarch64; then
            echo "the release already carries hazync-verify-aarch64: kept (this build was only tested)"
          else
            gh release upload "$TAG" -R "$REPO" hazync-verify-aarch64
          fi

  build-installer:
    # The Windows installer (hazync-setup-x86_64-windows.exe), built from THE TAG's app around the release's own prover
    # and worker by windows-installer.yml, which also installs it, uses it, uninstalls it, and checks the installed
    # host.exe is the release zip's byte for byte. It is a `sign` asset like the aarch64 verifier: it needs the
    # release's Windows host, so it can only be built after publishing, and sign must wait for it (the race above).
    # The tag is validated inside (env, then a vMAJOR.MINOR.PATCH match) before anything uses it.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      release: true

  attach-installer:
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hazync-setup-x86_64-windows
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        # ⚠ KEPT ONLY WHEN ALREADY SIGNED. PyInstaller and Inno Setup do not build byte-identical files, so on a re-sign
        # this build differs from the signed one and sign would refuse it (a re-sign may not change a signed hash): the
        # signed one stays, this build was only tested. But an installer on the release that NO manifest names yet was
        # never signed, so it is replaced by this tested build rather than trusted.
        run: |
          [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "::error::not a release tag: '$RAW_TAG'"; exit 1; }
          f=hazync-setup-x86_64-windows.exe
          [ -s "$f" ] || { echo "::error::the build produced no $f"; exit 1; }
          signed=""
          if gh release download "$RAW_TAG" -R "$REPO" -p SHA256SUMS.txt -D prev 2>/dev/null; then
            signed=$(awk -v f="$f" '$2==f {print $1}' prev/SHA256SUMS.txt)
          fi
          if [ -n "$signed" ]; then
            echo "$f is already signed in $RAW_TAG's manifest ($signed): kept (this build was only tested)"
          else
            gh release upload "$RAW_TAG" -R "$REPO" "$f" --clobber
            echo "attached $f ($(sha256sum "$f" | cut -c1-64))"
          fi

  sign:
    # MUST wait for the aarch64 verifier and the installer, or they silently do not get signed.
    #
    # This job writes SHA256SUMS over whatever assets the release carries AT THE MOMENT IT RUNS. Without
    # this dependency the two jobs race, and sign almost always wins — it only downloads, while the other
    # installs a cross-toolchain and compiles. The result is a release where hazync-verify-aarch64 is
    # present and correct but absent from the signed manifest, so an ARM user has a binary they cannot
    # check. Nothing fails; the manifest is simply short an entry.
    #
    # Shipped that way in v0.15.0 and v0.16.0. It regressed in #85, which moved this binary from a
    # committed file (already present at publish time, so always caught by the glob) to one built here —
    # trading a staleness bug for a race, and the race is quieter than what it replaced.
    #
    # The step that writes the manifest now also asserts the count, so a future reordering fails loudly
    # rather than shipping an unsigned artifact again.
    needs: [build-aarch64-verifier, attach-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate tag
        id: tag
        # The tag arrives through the ENVIRONMENT, never spliced into shell text.
        #
        # A `${{ }}` expression is substituted by GitHub into the script BEFORE bash parses it, so a
        # tag containing shell metacharacters is executed as code — in this job, which imports the
        # release-signing private key and holds `contents: write`. `workflow_dispatch` makes that
        # input directly attacker-supplied for anyone with write access, so the payoff is the signing
        # key itself and the ability to sign forged binaries with it. An env value is data: bash
        # expands "$RAW_TAG" after parsing and never re-parses its contents.
        #
        # Belt and braces: the value is also shape-checked, so anything that is not a release tag is
        # refused before it reaches `gh` at all.
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::refusing to sign: '$RAW_TAG' is not a vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      # The asset list, from THE TAG being signed (the same pinning reason as the checkout above). Only
      # this one file is checked out: nothing from the tree runs in the job that holds the signing key.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          sparse-checkout: |
            scripts/release-assets.txt
            reproduce/LIBZYNC_IDS
          sparse-checkout-cone-mode: false
          path: tagtree
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist && cd dist
          # Sign whatever host binaries the release actually carries (CPU-only, or CPU+CUDA) — a release
          # may ship the CUDA build later than the CPU build, so glob rather than hardcode both names.
          # hazync-* not hazync-host-*: from v0.11.0 the release also carries the standalone
          # verifier (hazync-verify-*), which is the artifact most people will actually download —
          # it is the thing that lets someone CHECK a proof without a prover. Signing the host
          # binaries but not the verifier would leave the widely-used one unattested.
          gh release download "$RELEASE_TAG" -R "$REPO" \
            -p 'hazync-*' --clobber
          ls -la
          # A manifest this release ALREADY carries (a re-sign): kept apart, checked in the signing step.
          mkdir -p ../prev
          gh release download "$RELEASE_TAG" -R "$REPO" -p 'SHA256SUMS.txt*' -D ../prev --clobber 2>/dev/null || true
          ls -la ../prev

      - name: Write SHA256SUMS over the binaries
        env:
          # Needed by the completeness assertion below, which asks the release what it actually carries
          # rather than trusting the local glob.
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          # every shipped artifact, deterministic order; fail if there are none to sign.
          #
          # hazync-worker is here because it is the artifact that CLAIMS AND SUBMITS WORK. It was
          # previously repo-only, so joining the proof party meant cloning — and an unsigned worker is
          # the worst thing on this list to leave unattested: it holds the contributor's signing key
          # and decides what gets submitted under their name.
          #
          # hazync-verify.wasm is the browser verifier. It is served from a web page, which is exactly
          # the delivery path where a substituted artifact is least likely to be noticed.
          # Sign EVERY hazync-* artifact that was downloaded, rather than a hand-maintained list.
          #
          # The list used to name the four assets that existed when it was written. Adding
          # hazync-coordinator.py and hazync-run-workers.sh to the release then failed signing outright
          # — correctly, because the assertion below spotted that two assets would go unsigned. But the
          # remedy was to edit a second list in a second repository file, which is the same
          # hand-maintained-copy problem `reproduce/METHOD_ID` and build.rs already document: a list
          # that must be updated in step with another list eventually is not.
          #
          # The download above is already `-p 'hazync-*'`, so the glob here IS the release's own set.
          # The assertion stops being about a stale list and becomes what it should always have been:
          # a check that everything on the release actually arrived.
          bins=$(ls hazync-* 2>/dev/null | sort)
          if [ -z "$bins" ]; then echo "::error::no hazync-* artifacts on the release to sign"; exit 1; fi

          # "Some artifacts" is not the bar — the bar is EVERY artifact the release carries. A glob that
          # silently matches four of five reads exactly like success, which is how v0.15.0 and v0.16.0
          # both shipped an unsigned aarch64 verifier. Compare against what is actually on the release.
          missing=""
          for a in $(gh release view "$RELEASE_TAG" -R "$REPO" --json assets --jq '.assets[].name' \
                     | grep -E '^hazync-'); do
            echo "$bins" | grep -qx "$a" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::these hazync-* assets are on the release but would NOT be signed:$missing"
            echo "::error::a manifest that covers only some artifacts is worse than none — it looks complete."
            exit 1
          fi
          echo "signing $(echo "$bins" | wc -l) artifact(s); none left unattested"

          # AND THE SET MUST BE EXACTLY THE RELEASE'S LIST (scripts/release-assets.txt at this tag): every
          # `release` and `sign` asset except the two this step is about to write. Matching only what
          # happens to be on the release would sign a release that is missing a binary, or carries an
          # extra one, as if it were complete.
          list=../tagtree/scripts/release-assets.txt
          if [ ! -f "$list" ]; then
            echo "::error::the tag has no scripts/release-assets.txt (releases before v0.23.0 did not); refusing to sign without the list"
            exit 1
          fi
          want=$(awk '($1=="release" || $1=="sign") && $2 ~ /^hazync-/ {print $2}' "$list" | sort)
          if [ "$bins" != "$want" ]; then
            echo "::error::the release's hazync-* assets are not exactly scripts/release-assets.txt"
            echo "on the release:"; echo "$bins"
            echo "wanted:";         echo "$want"
            exit 1
          fi
          for b in $bins; do
            [ -s "$b" ] || { echo "::error::$b is empty"; exit 1; }
          done

          # EVERY HOST AND VERIFIER MUST CARRY THIS TAG'S PUBLISHED IMAGE (review 11-12, release #2). The signature used
          # to attest "whatever is on the release": the name set and non-empty files were the only checks. The image id
          # comes from the TAG's reproduce/LIBZYNC_IDS. Hosts store it as 32 raw bytes, the verifiers as 64-hex text;
          # each exactly once (the Windows exe at least once, as scripts/windows-host.sh accepts it).
          ID=$(awk '$1=="libzync-product" && $2=="mainnet" {print $4}' ../tagtree/reproduce/LIBZYNC_IDS)
          [[ "$ID" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no libzync mainnet image id in the tag's reproduce/LIBZYNC_IDS"; exit 1; }
          python3 - "$ID" <<'PY'
          import sys, zipfile
          idh = sys.argv[1]; raw, hx = bytes.fromhex(idh), idh.encode()
          want = {"hazync-host-x86_64-linux-gnu": (raw, 1, 1), "hazync-host-x86_64-linux-gnu-cuda": (raw, 1, 1),
                  "hazync-verify-x86_64-linux-gnu": (hx, 1, 1), "hazync-verify-aarch64": (hx, 1, 1),
                  "hazync-verify.wasm": (hx, 1, 1)}
          bad = []
          for name, (needle, lo, hi) in want.items():
              n = open(name, "rb").read().count(needle)
              print(f"{name}: image {idh[:8]} {n}x"); bad += [] if lo <= n <= hi else [f"{name} carries it {n}x"]
          with zipfile.ZipFile("hazync-host-x86_64-windows-cuda.zip") as z:
              n = z.read("host.exe").count(raw)
          print(f"hazync-host-x86_64-windows-cuda.zip host.exe: image {idh[:8]} {n}x"); bad += [] if n >= 1 else ["host.exe does not carry it"]
          # The installer is compressed, so the id cannot be seen in it. windows-installer.yml (build-installer above)
          # installed it and checked the installed host.exe is the zip's byte for byte; here, only that it is one.
          b = open("hazync-setup-x86_64-windows.exe", "rb").read()
          ok = b[:2] == b"MZ" and b"Inno Setup" in b
          print(f"hazync-setup-x86_64-windows.exe: {'an Inno Setup installer' if ok else 'NOT an Inno Setup installer'}, {len(b)} bytes")
          bad += [] if ok else ["hazync-setup-x86_64-windows.exe is not an Inno Setup installer"]
          if bad:
              print("::error::not this tag's image (" + idh[:8] + "): " + "; ".join(bad)); sys.exit(1)
          PY
          # THE MANIFEST NAMES WHAT IT IS FOR: the tag, the commit the tag points at, and that image. `sha256sum -c`
          # (and --strict) skips `#` lines, so checking downloads works as before; the signature now also covers the
          # binding, so a manifest cannot be passed off as another tag's.
          COMMIT=$(git -C ../tagtree rev-parse HEAD)
          { echo "# hazync $RELEASE_TAG commit $COMMIT image $ID"
            echo "# signed by .github/workflows/release-sign.yml (run $GITHUB_RUN_ID); check with: sha256sum -c SHA256SUMS.txt"
            sha256sum $bins; } > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: PGP-sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY / GPG_PASSPHRASE secrets are not set on this repo."
            echo "Add them once (same values as bitcoin-ghost/ghost) to enable signing — see SECURITY.md."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # A RE-SIGN MAY NOT CHANGE WHAT WAS SIGNED (review 11-12, release #2): swapping an asset and dispatching this
          # workflow used to yield a valid maintainer signature over the swapped binary. If the release already carries
          # a manifest, its signature must verify and every asset in both must have the same hash. A changed binary is a
          # new version, not a re-sign.
          if [ -s prev/SHA256SUMS.txt ]; then
            [ -s prev/SHA256SUMS.txt.asc ] || { echo "::error::the release has a SHA256SUMS.txt with no signature: refusing to sign over it"; exit 1; }
            gpg --verify prev/SHA256SUMS.txt.asc prev/SHA256SUMS.txt \
              || { echo "::error::the release's existing SHA256SUMS.txt does not verify: refusing to sign"; exit 1; }
            python3 - prev/SHA256SUMS.txt SHA256SUMS.txt <<'PY'
          import sys
          def m(p): return {l.split()[1].lstrip("*"): l.split()[0] for l in open(p) if l.strip() and not l.startswith("#")}
          old, new = m(sys.argv[1]), m(sys.argv[2])
          changed = sorted(n for n in old.keys() & new.keys() if old[n] != new[n])
          if changed:
              print("::error::these assets differ from the hashes this release was already signed with: " + ", ".join(changed)); sys.exit(1)
          print(f"re-sign: {len(old.keys() & new.keys())} asset(s) unchanged since the last signature")
          PY
          fi
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Upload signed manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt SHA256SUMS.txt.asc \
            -R "$REPO" --clobber
          echo "Signed SHA256SUMS + .asc uploaded to $RELEASE_TAG."
