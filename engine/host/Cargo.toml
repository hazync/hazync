[package]
name = "hazync-engine"
version = "0.1.0"
edition = "2021"
description = "Hazync proving engine on OpenVM 2.1"

[workspace]

[[bin]]
name = "hzengine"
path = "src/main.rs"

[dependencies]
bitcode = { version = "0.6.9", features = ["serde"] }
zstd = "0.14.5"
cfg-if = "1.0"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
openvm-build = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-verify-stark-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-verify-stark-host = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-recursion-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
# generate_deferral_results: children of several images in one run (engine.rs attach_children_of)
openvm-deferral-circuit = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-stark-backend = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0", default-features = false }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0", default-features = false, features = ["cpu-backend"] }

[features]
default = []
cuda = ["openvm-sdk/cuda", "openvm-verify-stark-circuit/cuda"]
# Guest profiling (HZ_METRICS=<file.json>): instruction counts by guest function stack, from OpenVM's perf-metrics.
profile = ["openvm-sdk/perf-metrics", "openvm-sdk/metrics", "openvm-stark-sdk/metrics"]

[profile.release]
debug = 1

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows (FEASIBILITY Q12): stdout redirection through the process's standard handles (capture.rs, serve.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
