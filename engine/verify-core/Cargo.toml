[package]
name = "hazync-engine-verify"
version = "0.1.0"
edition = "2021"
description = "Hazync: check an engine (OpenVM) proof against a published image id and its journal (engine/VERIFIER.md)"

[dependencies]
# OpenVM v2.1.0 as released for native builds; a wasm32 build [patch]es it with engine/wasm-verify/openvm-abi-stable.patch
openvm-verify-stark-host = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0", default-features = false }
sha2 = "0.10"
bitcode = { version = "0.6", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[workspace]
