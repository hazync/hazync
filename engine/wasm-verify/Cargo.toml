[package]
name = "wasmv"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
# the checks themselves (engine/verify-core); this crate is their wasm-bindgen face
hazync-engine-verify = { path = "../verify-core" }

getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.130"
[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
hex = "0.4"

[workspace]

# OpenVM v2.1.0 + openvm-abi-stable.patch (abi_stable pulls libloading, which cannot build for wasm32)
[patch."https://github.com/openvm-org/openvm.git"]
openvm-verify-stark-host = { path = "../../../openvm-wasm/crates/verify" }
