[package]
name = "wasmv"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
# OpenVM v2.1.0 + openvm-abi-stable.patch
openvm-verify-stark-host = { path = "../../../openvm-wasm/crates/verify" }
openvm-stark-sdk = { version = "2.1.0", git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.1.0", default-features = false }
sha2 = "0.10"

getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
bitcode = { version = "0.6", features = ["serde"] }
wasm-bindgen = "=0.2.130"
[dev-dependencies]
serde_json = "1"
hex = "0.4"

[workspace]
