[package]
name = "deposit-compose-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "deposit-compose"
path = "src/main.rs"

[dependencies]
deposit-compose-methods = { path = "../compose-methods" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client"] }
swiftsync-verify = { path = "../../../../../swiftsync-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
