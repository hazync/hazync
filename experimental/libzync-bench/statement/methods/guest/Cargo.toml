[package]
name = "statement-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ['std', 'unstable'] }
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
ripemd = { version = "0.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# RISC Zero's accelerated k256 (bigint coprocessor): ECDSA and BIP-340 Schnorr. The core uses libsecp instead
# (ZYNCAPPS.md §7: a shipped guest should reuse it); this prototype measures the k256 path.
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "schnorr", "alloc"] }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
