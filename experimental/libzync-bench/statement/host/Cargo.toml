[package]
name = "statement-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
statement-methods = { path = "../methods" }
risc0-zkvm = { version = "=3.1.0", features = ["prove"] }
swiftsync-verify = { path = "../../../../swiftsync-verify" }
balance-statement = { path = "../../../../zapps/statement" }
libzync = { path = "../../../../libzync", default-features = false }
bip322 = "=0.0.12"
bitcoin = "0.32"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
bincode = "1"
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "=0.13.4", features = ["ecdsa", "schnorr"] }
