[package]
name = "ovm-trie"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
openvm = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.1.0" }
libzync = { path = "/root/fresh-bench/trie2/libzync", default-features = false }
[features]
# same format
ovm_iv = ["libzync/ovm_iv"]
zerocopy = []
ovm_sha = ["libzync/ovm_sha"]
# NEW format
ovm_nat = ["libzync/ovm_nat"]
# ablations (wrong results on purpose: they measure where the instructions go)
nohash = []
decodeonly = []
