# Dirty-page writeback for the prep runs' stores (installed as /etc/sysctl.d/90-libzync-prep.conf; `sysctl --system`).
# Large dirty limits and a one-hour expiry let prep's trie and coin-log writes batch up instead of stalling it.
# It was on the box only until 16.11.2026; values copied unchanged.
vm.dirty_expire_centisecs = 360000
vm.dirty_writeback_centisecs = 6000
vm.dirty_background_bytes = 12884901888
vm.dirty_bytes = 25769803776
