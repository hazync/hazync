# The paper prep: the FULL run, genesis..LZ_HI, the run that will follow the tip (REORG.md §14, decision 1);
# leaf bundles at the paper's sample heights. Installed as /etc/systemd/system/libzync-prep.service.d/run.conf.
# SAVE_EVERY 250 (was 1000, 16.11.2026): the trie's free-slot lists grow with the slots freed per save interval, so a
# shorter interval divides them by 4 (docs/libzync/PREP_MEMORY.md fix 1: about -22.5 GB at the tip, ESTIMATE; prep
# about 3-8% slower, ESTIMATE). A kill then loses at most 250 blocks.
[Service]
Environment=LZ_ROOT=/srv/bulk/libzync-prep
Environment=LZ_HI=974936
Environment=HAZYNC_PREP_SAVE_EVERY=250
Environment=HAZYNC_PREP_REPORT_EVERY=1000
Environment=HAZYNC_PREP_MIN_FREE_GB=200
Environment=HAZYNC_PREP_CHECK=/srv/bulk/libzync-prep/ref
Environment=HAZYNC_PREP_LEAF_AT=170,1000,100000,200000,270000,280000,290000,300000,400000,481824,550000,650000,709632,800000,900000,962000,967600,970000,972000,974000
