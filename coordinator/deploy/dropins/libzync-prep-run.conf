# The paper prep: the FULL run from genesis, the run that FOLLOWS THE TIP (REORG.md §14 decision 1, §19: D1); leaf bundles
# at the paper's sample heights and, for the board, every block from the handover height X = 974,937 on (the board
# pass, libzync-board-prep, ends at LZ_HI=974936 = X - 1; the coordinator's tip-run.conf names the same X). Installed as
# /etc/systemd/system/libzync-prep.service.d/run.conf. LZ_HI=follow needs a host with `libzync-prep <lo> follow` and
# HAZYNC_PREP_LEAF_FROM (REORG.md §19); an older host refuses `follow` (not a height) and the unit fails.
# SAVE_EVERY 250 (was 1000, 16.11.2026): the trie's free-slot lists grow with the slots freed per save interval, so a
# shorter interval divides them by 4 (docs/libzync/PREP_MEMORY.md fix 1: about -22.5 GB at the tip, ESTIMATE; prep
# about 3-8% slower, ESTIMATE). A kill then loses at most 250 blocks.
[Service]
Environment=LZ_ROOT=/srv/bulk/libzync-prep
Environment=LZ_HI=follow
Environment=HAZYNC_PREP_LEAF_FROM=974937
# at most this many leaf bundles waiting to be proved (review of D1, MEDIUM 3; round 2, MEDIUM 1): with tip blocks not
# proved the tip run would cut one per block until the disk floor stops it. When it reaches X (~19 days from 20.11.2026,
# ESTIMATE) it cuts the ~4,500 blocks from X to the tip at once; 12,000 = those, 30 days at 144 a day and a margin
# (the 20 sample bundles count too): ~115-145 GB of /srv/bulk's 3.3 TB (ESTIMATE: 9.6 MB per bundle at 481,824 MEASURED,
# more at the tip). Proven tip bundles are pruned (TIP_CLAIM_FIRST is on). When full, prep PAUSES before its next bundle
# (nothing is deleted); hazync-lz-check-reorg pages after an hour and says why (it reads the window from out/RUN.json).
Environment=HAZYNC_PREP_LEAF_WINDOW=12000
Environment=HAZYNC_PREP_SAVE_EVERY=250
Environment=HAZYNC_PREP_REPORT_EVERY=1000
Environment=HAZYNC_PREP_MIN_FREE_GB=200
Environment=HAZYNC_PREP_CHECK=/srv/bulk/libzync-prep/ref
# the sample leaf bundles for the paper's cost curve (kept for good: the leaf window only pauses prep, and the pruner's tip
# section only touches bundles from X = 974,937 on; test_prune_leaves_tip.py checks every height here survives it).
# 500000, 600000 and 700000 added 20.11.2026 (the 800000, 900000 and 962000 samples were already listed)
Environment=HAZYNC_PREP_LEAF_AT=170,1000,100000,200000,270000,280000,290000,300000,400000,481824,500000,550000,600000,650000,700000,709632,800000,900000,962000,967600,970000,972000,974000
