# The trie's in-RAM record cache for the paper prep. Installed as /etc/systemd/system/libzync-prep.service.d/cache.conf.
# 12288 MB = 2^27 slots, 9 GiB resident (was 20480 = 2^28 slots, 18 GiB; the cache rounds down to a power of two).
# docs/libzync/PREP_MEMORY.md fix 2: about -9.7 GB at every height; a few percent slower in the trie phase (ESTIMATE):
# compare PREP_TIMING past ~420k with the old run's.
[Service]
Environment=HAZYNC_TRIE_CACHE_MB=12288
