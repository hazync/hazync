# Live name: /etc/systemd/system/libzync-fetch.service.d/alert.conf — push to a phone when the paper prep's block fetcher
# stops for a reorg (exit 4, docs/libzync/REORG.md §11).
# RestartPreventExitStatus= in the unit makes those exits FAIL the unit instead of restarting it, which is what
# lets OnFailure= fire at all.
[Unit]
OnFailure=hazync-alert@%n.service
