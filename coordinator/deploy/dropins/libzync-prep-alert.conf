# Live name: /etc/systemd/system/libzync-prep.service.d/alert.conf — push to a phone when the paper prep
# stops for a reorg (exit 4, docs/libzync/REORG.md §11) or at the free-space floor (exit 3).
# RestartPreventExitStatus= in the unit makes those exits FAIL the unit instead of restarting it, which is what
# lets OnFailure= fire at all.
[Unit]
OnFailure=hazync-alert@%n.service
