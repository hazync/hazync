# D1, the tip run (docs/libzync/REORG.md §3, §14 decision 1, §19). Installed as
# /etc/systemd/system/hazync-lz-coordinator.service.d/tip-run.conf. The board pass (HAZYNC_BRIDGE_OUT, HAZYNC_LZ_STATE_DIR)
# serves blocks 1..974,936; the paper prep (libzync-prep, following the tip) every block from X = 974,937 on, and the
# state X - 1 its bundles start from. X must equal the paper prep's HAZYNC_PREP_LEAF_FROM (libzync-prep.service.d/run.conf)
# and be the board pass's LZ_HI + 1 (libzync-board-prep.service). Its reorg records are read from its out/reorg/records and
# acked in its own directory (libzync-prep.service HAZYNC_REORG_ACK_DIR). The fetchers' block directories: a reorg STOP
# marker there fences that run above its fork (nothing served, verified or credited above it until it is rewound).
# ROLLBACK is not "delete this file": with tip blocks verified, the board would read their states from the board pass
# (none) and latch its reorg alert. The full set is in coordinator/deploy/RUNBOOK.md ("Rolling back the tip run").
# TIP_CLAIM_FIRST=1 (the author's decision, 20.11.2026): tip blocks before the backfill's, to workers able to prove them
# (they say so with HAZYNC_TIP=1, or one of their tip blocks verified within TIP_CLAIM_EARNED_S of its claim, 1 h).
[Service]
Environment=HAZYNC_LZ_TIP_FROM=974937
Environment=HAZYNC_LZ_TIP_STATE_DIR=/var/lib/libzync-fast/out
Environment=HAZYNC_LZ_TIP_BRIDGE_OUT=/srv/bulk/libzync-prep/leaves
Environment=HAZYNC_LZ_TIP_REORG_ACK_DIR=/var/lib/hazync-lz/reorg-acks-tip
Environment=HAZYNC_LZ_TIP_BLOCKS_DIR=/srv/bulk/libzync-prep/blocks
Environment=HAZYNC_LZ_BLOCKS_DIR=/srv/bulk/libzync-board/blocks
Environment=TIP_CLAIM_FIRST=1
