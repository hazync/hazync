[Service]
# the zyncAPP relay (/api/zync/*, #694): read-only fact paths to the local zync-serve (hazync-lz-zync-serve.service)
Environment=ZYNC_SERVE_URL=http://127.0.0.1:8601
# /api/zync/proof: the proof the facts are at, kept in step by hazync-lz-zapp-follow (ROADMAP O2)
Environment=ZYNC_PROOF=/var/lib/hazync-lz/zapp/proof.rcpt
