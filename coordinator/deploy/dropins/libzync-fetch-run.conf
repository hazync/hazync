# The paper prep's block source. Installed as /etc/systemd/system/libzync-fetch.service.d/run.conf. LZ_HI=follow: the
# fetcher's `range 1 follow`, to the node's tip as it moves (REORG.md §4, §19).
[Service]
Environment=LZ_ROOT=/srv/bulk/libzync-prep
Environment=LZ_HI=follow
Environment=HAZYNC_RPC_COOKIE=/var/lib/bitcoind/.cookie
