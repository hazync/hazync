# Memory policy for the paper prep. Installed as /etc/systemd/system/libzync-prep.service.d/memory.conf.
# NO cap, on purpose: the repo unit's MemoryHigh=10G / MemoryMax=14G would kill prep at every save point for ever
# (its trie cache alone is 9-18 GiB). A cap is only safe once the save-point peak is bounded (PREP_MEMORY.md fixes
# B+C, then about MemoryHigh=38G / MemoryMax=42G). The box also carries the same values as runtime overrides in
# /etc/systemd/system.control/ (systemctl set-property); this file states them where the repo can see them.
# OOMScoreAdjust 500: if the box ever runs out, the kernel kills prep -- which resumes from its newest save point by
# itself -- before bitcoind or the coordinator (PREP_MEMORY.md fix 3).
[Service]
MemoryHigh=infinity
MemoryMax=infinity
OOMScoreAdjust=500
