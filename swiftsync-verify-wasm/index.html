<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwiftSync Proof Check</title>
<style>
  :root { --bg: #fbfbf9; --fg: #1d1d1b; --muted: #5d5d58; --line: #d9d8d2; --ok: #1f7a3a; --bad: #b42318; --demo: #8a5a00; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe6; --muted: #a3a29b; --line: #34332f; --ok: #5cc27b; --bad: #f2786a; --demo: #e0b354; --card: #1d1d1b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 24px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; }
  label span { font-weight: 400; color: var(--muted); font-size: .85rem; }
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; }
  button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; justify-self: start; }
  #out { margin-top: 24px; }
  .verdict { font-weight: 700; font-size: 1.1rem; padding: 10px 12px; border-radius: 8px; border: 1px solid currentColor; }
  .v-ok { color: var(--ok); } .v-demo { color: var(--demo); } .v-fail { color: var(--bad); }
  ul.checks { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 4px; }
  ul.checks li { font-family: ui-monospace, monospace; font-size: .82rem; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .fail { color: var(--bad); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .9rem; }
  dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>SwiftSync proof check</h1>
  <p class="lede">Checks a libzync proof that a SwiftSync hints file is correct, on this device. Nothing is uploaded: the proof is verified by WebAssembly in this page.</p>
  <form id="f">
    <label>Network
      <select id="network"><option value="signet">signet</option><option value="mainnet">mainnet</option></select>
    </label>
    <label>Proof <span>a receipt (.rcpt) or proof bundle (.sspf)</span>
      <input type="file" id="receipt" required>
    </label>
    <label>Hints file <span>the SwiftSync hints file the proof is about</span>
      <input type="file" id="hints" required>
    </label>
    <label>Image id <span>optional: the id you rebuilt yourself; empty uses the built-in one shown below</span>
      <input type="text" id="image" placeholder="64 hex digits" spellcheck="false">
    </label>
    <label>Anchor state <span>optional: a trusted mid-chain state (JSON); the verdict is then at most DEMO</span>
      <input type="file" id="anchor">
    </label>
    <button type="submit">Check</button>
    <p class="note" id="builtin"></p>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<script type="module">
import { loadVerifier } from './swiftsync-verify.js';
const v = await loadVerifier(fetch('./swiftsync_verify_wasm.wasm'));
const $ = (id) => document.getElementById(id);
const showBuiltin = () => { $('builtin').textContent = `Built-in ${$('network').value} image: ${v.imageId($('network').value)}`; };
$('network').addEventListener('change', showBuiltin); showBuiltin();
const bytes = async (input) => input.files[0] ? new Uint8Array(await input.files[0].arrayBuffer()) : null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('out').textContent = 'Checking…';
  const anchor = await bytes($('anchor'));
  const r = v.verify({ network: $('network').value, receipt: await bytes($('receipt')), hints: await bytes($('hints')),
    imageHex: $('image').value.trim(), anchorJson: anchor ? new TextDecoder().decode(anchor) : '' });
  const words = { ok: 'OK: the hints file is proven correct for the chain below', demo: 'DEMO: consistent from the given anchor only, not a proof of the file', fail: 'FAIL' };
  let html = `<div class="verdict v-${r.verdict}">${esc(words[r.verdict])}</div><ul class="checks">`;
  for (const c of r.checks) html += `<li class="${c.ok ? 'ok' : 'fail'}">[${c.ok ? 'ok' : 'FAIL'}] ${esc(c.what)}</li>`;
  html += '</ul>';
  if (r.height != null) {
    html += `<dl><dt>height</dt><dd>${r.height}</dd><dt>tip</dt><dd>${esc(r.tip)}</dd><dt>chainwork</dt><dd>${esc(r.chainwork)}</dd><dt>UTXO set at H</dt><dd>${r.utxo_leaves} coins</dd><dt>profile</dt><dd>${esc(r.profile)}</dd></dl>`;
    html += '<p class="note">One check is yours: the tip above must be the block at this height on your own node, with this chainwork (proposal §5 step 7).</p>';
  }
  $('out').innerHTML = html;
});
</script>
</body>
</html>
