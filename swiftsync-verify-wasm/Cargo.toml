[package]
name = "swiftsync-verify-wasm"
version = "0.1.0"
edition = "2021"
description = "swiftsync-verify compiled to WebAssembly: check a SwiftSync hints proof in a browser, on the device"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The same library as the CLI (one implementation of the checks); raw ABI, no wasm-bindgen, as ../history/verifier-wasm.
[dependencies]
# default-features = false: the statement check (bip322, secp256k1) stays out of the published .wasm unless asked for
swiftsync-verify = { path = "../swiftsync-verify", default-features = false }
serde_json = "1"

# `statement`: the statement-of-balance check (docs/libzync/STATEMENT_ZAPP.md), export `verify_statement`. Off by default.
[features]
statement = ["swiftsync-verify/statement"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
