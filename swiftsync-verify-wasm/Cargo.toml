[package]
name = "swiftsync-verify-wasm"
version = "0.1.0"
edition = "2021"
description = "swiftsync-verify compiled to WebAssembly: check a SwiftSync hints proof in a browser, on the device"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The same library as the CLI (one implementation of the checks); raw ABI, no wasm-bindgen, as ../history/verifier-wasm.
[dependencies]
swiftsync-verify = { path = "../swiftsync-verify" }
serde_json = "1"
sha2 = "0.10"
# The wasm32 build needs OpenVM's abi-stable patch, stark-backend's nologging patch (every stark-backend crate from that
# one copy) and RUSTFLAGS --cfg getrandom_backend="custom"; see engine/VERIFIER.md step 5. Engine proofs are the only
# kind (engine/CUTOVER.md); the `engine` feature now only adds the refusing random source for that wasm32 build.
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"], optional = true }
getrandom03 = { package = "getrandom", version = "0.3", optional = true }

[features]
engine = ["dep:getrandom02", "dep:getrandom03"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
