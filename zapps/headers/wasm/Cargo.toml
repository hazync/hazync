[package]
name = "zapp-headers-wasm"
version = "0.1.0"
edition = "2021"
description = "The header-chain zyncAPP in WebAssembly: check a header-chain proof, and a block or transaction on it, in a browser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The zAPP's own library (one implementation of the check, as the CLI); raw ABI, no wasm-bindgen.
[dependencies]
zapp-headers = { path = ".." }
swiftsync-verify = { path = "../../../swiftsync-verify" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
