[package]
name = "zapp-headers"
version = "0.1.0"
edition = "2021"
description = "The header-chain zyncAPP: check a proof of the mainnet header chain from genesis, and a block or transaction on it"
license = "MIT"
publish = false

# A zAPP module (docs/libzync/ZYNCAPPS.md §9), NOT part of the core verifier: it uses swiftsync-verify as a library
# (receipt checks, images, work) and adds the header-chain check. The core never changes when a zAPP is added.
# The library only: the CLI is its own crate (cli/), so the library and its WASM module never link the CLI's
# chain-identity lookups (zapps/common: curl, bitcoin-cli). Own workspace, as the core verifier's crates.

[lib]
name = "zapp_headers"
path = "src/lib.rs"

[features]
# engine (OpenVM) header-chain proofs: verify_headers_with + a key (engine/VERIFIER.md)
engine = ["swiftsync-verify/engine"]

[dependencies]
swiftsync-verify = { path = "../../swiftsync-verify" }
# libzync::facts: the strict compact-size reader (the one the core verifier and the zyncAPP images use)
libzync = { path = "../../libzync", default-features = false }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
