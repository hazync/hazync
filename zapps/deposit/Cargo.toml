[package]
name = "zapp-deposit"
version = "0.1.0"
edition = "2021"
description = "The deposit-proof zyncAPP: a transaction in a fully validated block, buried under the header chain"
license = "MIT"
publish = false

# A zAPP module (docs/libzync/ZYNCAPPS.md §9), NOT part of the core verifier: it uses swiftsync-verify (the core proof,
# tx facts) and the header-chain zAPP (zapps/headers: the header chain, its MMR) as libraries. The core never changes
# when a zAPP is added. The library only: the CLI is its own crate (cli/), so the library and its WASM module never link
# the CLI's chain-identity lookups (zapps/common: curl, bitcoin-cli). Own workspace, as the core verifier's crates.

[lib]
name = "zapp_deposit"
path = "src/lib.rs"

[features]

[dependencies]
swiftsync-verify = { path = "../../swiftsync-verify" }
# the core receipt check and image resolution every zAPP shares (zapps/corecheck: no CLI code)
zapp-corecheck = { path = "../corecheck" }
zapp-headers = { path = "../headers" }
libzync = { path = "../../libzync", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
