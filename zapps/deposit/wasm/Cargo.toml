[package]
name = "zapp-deposit-wasm"
version = "0.1.0"
edition = "2021"
description = "The deposit-proof zyncAPP in WebAssembly: check a deposit proof in a browser, on the device"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The zAPP's own library (one implementation of the check, as the CLI); raw ABI, no wasm-bindgen.
[dependencies]
zapp-deposit = { path = ".." }
zapp-headers = { path = "../../headers" }
swiftsync-verify = { path = "../../../swiftsync-verify" }
zapp-corecheck = { path = "../../corecheck" }
serde_json = "1"

# the refusing random source (src/lib.rs no_rng): OpenVM's graph names getrandom
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "0.3" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
