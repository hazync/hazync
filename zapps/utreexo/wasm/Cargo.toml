[package]
name = "zapp-utreexo-wasm"
version = "0.1.0"
edition = "2021"
description = "zapp-utreexo compiled to WebAssembly: check a Utreexo roots proof on the device"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The same library as the CLI (one implementation of the checks); raw ABI, no wasm-bindgen, as swiftsync-verify-wasm.
[dependencies]
zapp-utreexo = { path = ".." }
swiftsync-verify = { path = "../../../swiftsync-verify" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
