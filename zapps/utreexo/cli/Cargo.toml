[package]
name = "zapp-utreexo-cli"
version = "0.1.0"
edition = "2021"
description = "zapp-utreexo: the Utreexo roots zyncAPP's command line (zapps/utreexo)"
license = "MIT"
publish = false

# The CLI, apart from the library (..): it alone takes the chain-identity flags every zAPP CLI shares (zapps/common:
# --expect, --mempool, --bitcoin-cli), so the library and WASM module carry none of that code.

[[bin]]
name = "zapp-utreexo"
path = "src/main.rs"

[dependencies]
zapp-utreexo = { path = "..", features = ["tip"] }
zapp-common = { path = "../../common" }
swiftsync-verify = { path = "../../../swiftsync-verify" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
