[package]
name = "zapp-common"
version = "0.1.0"
edition = "2021"
description = "What every zAPP CLI shares: the chain-identity flags (--expect, --mempool, --bitcoin-cli), on the core verifier's identity helpers"
license = "MIT"
publish = false

# Not a zAPP: the part of every zAPP's CLI that must be the same in each (docs/libzync/ZYNCAPPS.md §9). On swiftsync-verify
# as a library (parse_expect, identity_matches); NOT part of the core verifier. Own workspace, as the core verifier's crates.

[lib]
name = "zapp_common"
path = "src/lib.rs"

[dependencies]
swiftsync-verify = { path = "../../swiftsync-verify" }
serde_json = "1"

[features]
# TESTS ONLY, never a release: a zAPP CLI's `regtest-test` feature enables it with zapp-corecheck's (the regtest image of
# scripts/zapp-regtest). It adds no lookup of its own (every lookup here is network-agnostic: `getblockhash` names the
# node's ACTIVE chain, which after a reorg or `invalidateblock` is the other branch); it refuses to build without debug
# assertions, as zapp-corecheck's.
regtest-test = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
