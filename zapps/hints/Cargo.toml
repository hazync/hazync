[package]
name = "zapp-hints"
version = "0.1.0"
edition = "2021"
description = "The SwiftSync hints zyncAPP: check a proof that a downloaded hints file is the one for block H of a proven chain"
license = "MIT"
publish = false

# A zAPP module (docs/libzync/ZYNCAPPS.md §9), NOT part of the core verifier: it uses swiftsync-verify as a library
# (receipt verification, chain state, facts) and adds the hints check. The core never changes when a zAPP is added.
# The library only: the CLI is its own crate (cli/), so the library, its C ABI and its WASM module never link the CLI's
# chain-identity lookups (zapps/common: curl, bitcoin-cli). Own workspace, as the core verifier's crates.

[lib]
name = "zapp_hints"
path = "src/lib.rs"

[dependencies]
swiftsync-verify = { path = "../../swiftsync-verify" }
libzync = { path = "../../libzync", default-features = false, features = ["hints"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
