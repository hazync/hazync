[package]
name = "zapp-liveness"
version = "0.1.0"
edition = "2021"
description = "The coin-liveness zyncAPP: one outpoint's state after a height, checked against a verified core proof and the caller's question"
license = "MIT"
publish = false

# A zAPP module (docs/libzync/ZYNCAPPS.md §9), NOT part of the core verifier: it uses swiftsync-verify as a library
# (receipt verification, chain state, facts) and adds the liveness check. The core never changes when a zAPP is added.
# The library only: the CLI is its own crate (cli/), so the library, its C ABI and its WASM module never link the CLI's
# chain-identity lookups (zapps/common: curl, bitcoin-cli). Own workspace, as the core verifier's crates.

[lib]
name = "zapp_liveness"
path = "src/lib.rs"

[dependencies]
swiftsync-verify = { path = "../../swiftsync-verify" }
# The core receipt check every zAPP on a core proof makes (zapps/corecheck: no CLI code)
zapp-corecheck = { path = "../corecheck" }
libzync = { path = "../../libzync", default-features = false, features = ["liveness"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# the tests compute a fixture key's pin (corecheck::with_key requires one: review R2-5 #1); already in the graph
sha2 = "0.10"

[features]
# TESTS ONLY (zapps/corecheck's regtest-test, scripts/zapp-regtest): the regtest harness's image for the OK-verdict
# tests on real regtest proofs. Never in a release or WASM build (corecheck's compile_error!, scripts/wasm-build.sh).
regtest-test = ["zapp-corecheck/regtest-test"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
