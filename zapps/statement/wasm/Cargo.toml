[package]
name = "zapp-statement-wasm"
version = "0.1.0"
edition = "2021"
description = "The balance statement zyncAPP's checker in WebAssembly (docs/libzync/STATEMENT_ZAPP.md)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The zAPP's own module: the statement library (..) on top of the core verifier library (swiftsync-verify), which
# verifies the receipt. Raw ABI, no wasm-bindgen, as ../../../swiftsync-verify-wasm. The core .wasm is built separately
# and carries no statement code.
[dependencies]
zapp-statement = { path = ".." }
swiftsync-verify = { path = "../../../swiftsync-verify" }
# the core receipt check and image resolution every zAPP shares (zapps/corecheck: no CLI code)
zapp-corecheck = { path = "../../corecheck" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
