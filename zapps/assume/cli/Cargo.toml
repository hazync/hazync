[package]
name = "zapp-assume-cli"
version = "0.1.0"
edition = "2021"
description = "zapp-assume: the assumevalid and assumeutxo zyncAPPs' command line (zapps/assume)"
license = "MIT"
publish = false

# The CLI, apart from the library (..): it alone takes the chain-identity flags every zAPP CLI shares (zapps/common:
# --expect, --mempool, --bitcoin-cli), so the library, C ABI and WASM module carry none of that code.

[[bin]]
name = "zapp-assume"
path = "src/main.rs"

[dependencies]
zapp-assume = { path = ".." }
zapp-common = { path = "../../common" }
zapp-corecheck = { path = "../../corecheck" }
swiftsync-verify = { path = "../../../swiftsync-verify" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
