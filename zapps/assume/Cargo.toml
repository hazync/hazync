[package]
name = "zapp-assume"
version = "0.1.0"
edition = "2021"
description = "The assumevalid and assumeutxo zyncAPPs: the -assumevalid block and a dumptxoutset snapshot, checked against a verified core proof"
license = "MIT"
publish = false

# A zAPP module (docs/libzync/ZYNCAPPS.md §9), NOT part of the core verifier: it uses swiftsync-verify as a library
# (receipt verification, chain state) and adds the assume checks. The core never changes when a zAPP is added.
# Own workspace, as the core verifier's crates.

[lib]
name = "zapp_assume"
path = "src/lib.rs"

[[bin]]
name = "zapp-assume"
path = "src/main.rs"

[dependencies]
swiftsync-verify = { path = "../../swiftsync-verify" }
# The chain-identity flags every zAPP CLI takes, the core check every zAPP on a core proof makes (zapps/common)
zapp-common = { path = "../common" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
bincode = "1"
serde_json = "1"
sha2 = "0.10"
# The assumeutxo checker's ECMH: secp256k1's base field. Already in the tree through risc0-groth16, so no new crate;
# pure Rust, so it builds for WASM.
ark-ff = { version = "=0.5.0", default-features = false }

[dev-dependencies]
# the ECMH map and sum against a num-bigint reference, as libzync/src/host.rs ecmh_hint computes it
num-bigint = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
